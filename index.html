<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Power Rankings</title>
<style>
:root{
  --bg:#0f1115; --panel:#171a21; --panel2:#1e2229; --border:#2a2f3a;
  --text:#e8eaf0; --muted:#9aa3b2; --muted2:#6b7280; --accent:#5b8cff;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f5f6f8; --panel:#ffffff; --panel2:#eef0f4;
    --border:#dfe3ea; --text:#1a1d24; --muted:#5a6270; --muted2:#8a93a3;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1115; --panel:#171a21; --panel2:#1e2229; --border:#2a2f3a; --text:#e8eaf0; --muted:#9aa3b2; --muted2:#6b7280;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
.wrap{max-width:1500px; margin:0 auto; padding:16px 14px 50px;}
h1{font-size:1.25rem; margin:0 0 3px;}
.sub{color:var(--muted); font-size:.82rem; margin-bottom:14px;}
.controls{display:flex; align-items:center; gap:14px; margin-bottom:14px; font-size:.82rem;}
.controls label{display:flex; align-items:center; gap:6px; cursor:pointer;}

.board{display:flex; gap:14px; overflow-x:auto; padding-bottom:12px;}
.team-col{flex:0 0 280px; background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:12px;}
.team-head{display:flex; align-items:center; gap:8px; margin-bottom:6px;}
.rank-badge{
  width:26px; height:26px; border-radius:7px; background:var(--panel2); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center; font-size:.78rem; font-weight:700; flex-shrink:0;
}
.team-name{font-size:1rem; font-weight:700; flex:1;}
.team-total{font-size:.85rem; font-weight:700; background:var(--panel2); border:1px solid var(--border); border-radius:7px; padding:2px 8px;}
.pill-row{display:flex; gap:5px; flex-wrap:wrap; margin:8px 0 10px;}
.pill{font-size:.65rem; font-weight:600; padding:2px 7px; border-radius:5px; background:var(--panel2); color:var(--muted); border:1px solid var(--border);}

.asset-list{display:flex; flex-direction:column; gap:2px; max-height:70vh; overflow-y:auto;}
.asset-row{display:flex; align-items:center; gap:6px; padding:4px 6px; border-radius:6px; font-size:.78rem;}
.asset-idx{color:var(--muted2); font-size:.68rem; width:18px; flex-shrink:0; text-align:right;}
.pos-tag{font-size:.62rem; font-weight:700; padding:1px 5px; border-radius:4px; color:#fff; width:28px; text-align:center; flex-shrink:0;}
.asset-name{flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.asset-val{font-size:.75rem; font-weight:600; flex-shrink:0; width:44px; text-align:right;}
.asset-row.pick{opacity:.75;}
</style>
</head>

const POS_COLORS = {
  QB:{border:'#7C3AED'}, RB:{border:'#059669'}, WR:{border:'#2563EB'},
  TE:{border:'#B45309'}, PICK:{border:'#6B7280'}
};
function fmt(v){ return (v||0).toLocaleString(); }
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function render(){
  const board = document.getElementById("board");
  board.innerHTML = TEAMS.map(t=>{
    const assets = t.assets;
    const rows = assets.map((a,i)=>{
      const c = POS_COLORS[a.pos] || POS_COLORS.PICK;
      return `<div class="asset-row ${a.pos==='PICK'?'pick':''}">
        <span class="asset-idx">${i+1}</span>
        <span class="pos-tag" style="background:${c.border};">${a.pos}</span>
        <span class="asset-name">${esc(a.player)}</span>
        <span class="asset-val">${fmt(a.value)}</span>
      </div>`;
    }).join("");
    return `<div class="team-col">
      <div class="team-head">
        <div class="rank-badge">${t.rank}</div>
        <div class="team-name">${esc(t.team)}</div>
        <div class="team-total">${fmt(t.total)}</div>
      </div>
      <div class="pill-row">
        <span class="pill">QB: ${ordinal(t.posRank.QB)}</span>
        <span class="pill">RB: ${ordinal(t.posRank.RB)}</span>
        <span class="pill">WR: ${ordinal(t.posRank.WR)}</span>
        <span class="pill">TE: ${ordinal(t.posRank.TE)}</span>
      </div>
      <div class="asset-list">${rows}</div>
    </div>`;
  }).join("");
}
function ordinal(n){
  const s = ["th","st","nd","rd"], v = n % 100;
  return n + (s[(v-20)%10] || s[v] || s[0]);
}
render();
